<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F52" />
      <stop offset="100%" stop-color="#001438" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Base Squircle App Icon (Dark Nautical Navy) -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="116" height="116" rx="24" fill="none" stroke="#F37021" stroke-width="3" opacity="0.9" />

  <!-- Fluvial River Waves at Bottom (Indicateur Hydrométrie / Nautique) -->
  <path d="M 12 82 C 26 77, 40 85, 60 80 C 80 75, 94 83, 108 79" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 14 91 C 28 86, 42 94, 60 89 C 78 84, 92 92, 106 88" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Protection Civile Official Emblem (Center-Top) -->
  <g transform="translate(20, 8) scale(0.8)">
    <!-- Orange Disc -->
    <circle cx="50" cy="50" r="49" fill="#F37021" />

    <!-- White Triangle Shield -->
    <path
      d="M 50 4 
         C 52 4, 54 8, 56 12 
         L 88 74 
         C 90 78, 88 83, 84 83 
         L 16 83 
         C 12 83, 10 78, 12 74 
         L 44 12 
         C 46 8, 48 4, 50 4 Z"
      fill="#FFFFFF"
    />

    <!-- Dark Blue Triangle -->
    <path
      d="M 50 18
         L 77.5 73.5
         L 22.5 73.5
         Z"
      fill="#002D72"
    />

    <!-- Fouled Anchor -->
    <circle cx="50" cy="32.5" r="3.6" stroke="#FFFFFF" stroke-width="1.9" fill="none" />
    <circle cx="50" cy="32.5" r="1.6" fill="#002D72" />
    <rect x="38.5" y="37.5" width="23" height="2.8" rx="1.2" fill="#FFFFFF" />
    <rect x="48.4" y="36.5" width="3.2" height="27" rx="0.8" fill="#FFFFFF" />
    <path
      d="M 47.5 33.5
         C 43.5 36, 43.5 41, 49 43
         C 56 45, 57 51, 51 55
         C 45 59, 44 63, 49 67"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="1.6"
      stroke-linecap="round"
    />
    <path
      d="M 37.5 53
         C 36 62, 42 67, 50 67
         C 58 67, 64 62, 62.5 53"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.4"
      stroke-linecap="round"
    />
    <polygon points="36,50 41,56.5 33.5,56.5" fill="#FFFFFF" />
    <polygon points="64,50 66.5,56.5 59,56.5" fill="#FFFFFF" />
  </g>

  <!-- Tactical "BPI" Badge at bottom to eliminate any confusion -->
  <rect x="35" y="96" width="50" height="18" rx="6" fill="#F37021" stroke="#FFFFFF" stroke-width="1.5" />
  <text x="60" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">BPI</text>
</svg>
