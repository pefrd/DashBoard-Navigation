</button>


<!-- 2. AJOUTER CETTE SECTION DANS LE CONTENEUR DES PAGES DE VOTRE APP -->

  <nav class="ponts-submenu">

        <button class="btn-action" id="btn-prev">◀ Amont</button>

  <!-- SOUS-MODULE 2 : FLASHCARDS -->
  <div class="ponts-view" id="subview-flashcard">

      <div style="font-size:0.75rem; color:var(--primary); font-weight:700;" id="fc-top-lbl">PONT N°1</div>
      <div style="font-size:1.1rem; font-weight:800;" id="fc-main-txt">13e (RG) ↔ 12e (RD)</div>
      <div style="font-size:0.8rem; color:var(--text-muted);" id="fc-sub-txt">Touchez pour retourner</div>
    </div>
    <div class="action-row">
      <button class="btn-action err" id="fc-again">❌ À revoir</button>
      <button class="btn-action ok" id="fc-known">✅ Connu</button>
    </div>
  </div>

  <!-- SOUS-MODULE 3 : QUIZ -->
  <div class="ponts-view" id="subview-quiz">
    <div class="bridge-card-detail">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:0.75rem; font-weight:800; color:var(--primary);" id="quiz-score-lbl">Score : 0/0</span>
        <button class="btn-changer" id="btn-qmode" style="font-size:0.7rem; padding:4px 8px;">QCM / Carte</button>
      </div>
      <div class="bridge-name-lg" id="quiz-question-title" style="font-size:1.05rem;">Quel est ce pont ?</div>
      <div style="font-size:0.78rem; color:var(--text-muted);" id="quiz-hint">Indice</div>
      <div style="display:flex; flex-direction:column; gap:6px; margin-top:4px;" id="quiz-options-box"></div>
    </div>
  </div>

  <!-- SOUS-MODULE 4 : RÉCITATION 1-37 -->
  <div class="ponts-view" id="subview-chain">
    <div class="bridge-card-detail">
      <div style="font-size:0.75rem; font-weight:800; color:var(--primary);" id="chain-prog-lbl">Pont n°1 / 37</div>
      <div class="bridge-name-lg" id="chain-title">❓ Quel est le pont n°1 ?</div>
      <div style="font-size:0.8rem; color:var(--text-muted);" id="chain-hint">Indice</div>
      <input type="text" class="mobile-inp" id="chain-input" placeholder="Tapez le nom (ex: Sully, Bir-Hakeim...)" autocomplete="off">
      <div id="chain-feedback" style="font-size:0.84rem; font-weight:700; min-height:1.3em;"></div>
      <div class="action-row">
        <button class="btn-action" id="chain-reveal">👁️ Voir</button>
        <button class="btn-action primary" id="chain-submit">Valider</button>
      </div>
    </div>
  </div>
</section>

<script>

  { id: 4, name: "Passerelle Simone-de-Beauvoir", sector: 1, type: "Piéton", banks: "Parvis BnF ↔ Parc de Bercy", year: 2006, key: "Simone", clue: "Passerelle piétonne en lentille centrale.", x: 836, y: 400 },
  { id: 5, name: "Pont de Bercy", sector: 1, type: "Route + Métro 6", banks: "13e ↔ 12e (Bercy)", year: 1864, key: "Boire", clue: "Pont à 2 niveaux portant le Métro 6.", x: 804, y: 368 },

  { id: 7, name: "Viaduc d'Austerlitz", sector: 1, type: "Ferroviaire", banks: "Austerlitz ↔ Quai Rapée", year: 1904, key: "Viaduc", clue: "Arche métallique réservée au Métro 5.", x: 742, y: 308 },
  { id: 8, name: "Pont d'Austerlitz", sector: 1, type: "Routier", banks: "Jardin des Plantes ↔ Bastille", year: 1855, key: "Austerlitz", clue: "Pont routier face au Jardin des Plantes.", x: 712, y: 282 },
  { id: 9, name: "Pont de Sully", sector: 2, type: "Routier", banks: "5e ↔ Île St-Louis ↔ 4e", year: 1876, key: "Sully", clue: "Traverse toute la Seine sur la pointe est de l'Île St-Louis.", x: 675, y: 258 },
  { id: 10, name: "Pont de la Tournelle", sector: 2, type: "Routier", banks: "5e (RG) ↔ Île Saint-Louis", year: 1930, key: "tourne", clue: "Bras sud, statue de Sainte Geneviève.", x: 642, y: 274 },
  { id: 11, name: "Pont Marie", sector: 2, type: "Routier", banks: "Île Saint-Louis ↔ 4e", year: 1635, key: "Marie", clue: "2e plus ancien pont de Paris (1635).", x: 652, y: 222 },
  { id: 12, name: "Pont Louis-Philippe", sector: 2, type: "Routier", banks: "Île Saint-Louis ↔ Marais", year: 1862, key: "Louis-Philippe", clue: "Relie l'île au quartier du Marais.", x: 622, y: 210 },
  { id: 13, name: "Pont Saint-Louis", sector: 2, type: "Piéton", banks: "Île St-Louis ↔ Île de la Cité", year: 1970, key: "Saint-Louis", clue: "Passerelle reliant les deux îles.", x: 608, y: 242 },
  { id: 14, name: "Pont de l'Archevêché", sector: 3, type: "Routier", banks: "5e ↔ Chevet Notre-Dame", year: 1828, key: "Archevêque", clue: "Derrière le chevet de Notre-Dame.", x: 590, y: 266 },
  { id: 15, name: "Pont au Double", sector: 3, type: "Routier", banks: "5e ↔ Flanc Notre-Dame", year: 1883, key: "Double", clue: "Nom du péage médiéval.", x: 568, y: 256 },
  { id: 16, name: "Pont d'Arcole", sector: 3, type: "Routier", banks: "Cité ↔ Hôtel de Ville", year: 1855, key: "Arcole", clue: "Débouche face à l'Hôtel de Ville.", x: 578, y: 198 },
  { id: 17, name: "Petit-Pont-Cardinal-Lustiger", sector: 3, type: "Routier", banks: "Rue St-Jacques ↔ Cité", year: 1853, key: "Petit", clue: "Le plus court de Paris (32 m).", x: 546, y: 246 },
  { id: 18, name: "Pont Notre-Dame", sector: 3, type: "Routier", banks: "Cité ↔ Quai de Gesvres", year: 1914, key: "Notre-Dame", clue: "Prolonge le Petit-Pont.", x: 556, y: 188 },
  { id: 19, name: "Pont Saint-Michel", sector: 3, type: "Routier", banks: "Place St-Michel ↔ Cité", year: 1857, key: "Saint-Michel", clue: "Face à la fontaine Saint-Michel.", x: 524, y: 236 },
  { id: 20, name: "Pont au Change", sector: 3, type: "Routier", banks: "Conciergerie ↔ Châtelet", year: 1860, key: "Changent", clue: "Ancien pont des changeurs.", x: 534, y: 178 },
  { id: 21, name: "Pont Neuf", sector: 3, type: "Routier", banks: "6e ↔ Pointe Cité ↔ 1er", year: 1607, key: "Neuf", clue: "Le plus ancien pont de Paris (1607).", x: 498, y: 195 },
  { id: 22, name: "Pont des Arts", sector: 4, type: "Piéton", banks: "Institut de France ↔ Louvre", year: 1804, key: "Arts", clue: "Passerelle piétonne face au Louvre.", x: 462, y: 175 },
  { id: 23, name: "Pont du Carrousel", sector: 4, type: "Routier", banks: "Quai Voltaire ↔ Louvre", year: 1939, key: "Carrousel", clue: "Face aux guichets du Louvre.", x: 430, y: 160 },
  { id: 24, name: "Pont Royal", sector: 4, type: "Routier", banks: "Orsay ↔ Tuileries", year: 1689, key: "Royal", clue: "Financé par Louis XIV en 1689.", x: 398, y: 146 },
  { id: 25, name: "Passerelle Léopold-Sédar-Senghor", sector: 4, type: "Piéton", banks: "Orsay ↔ Tuileries", year: 1999, key: "Senghor", clue: "Ancienne passerelle de Solférino.", x: 366, y: 135 },
  { id: 26, name: "Pont de la Concorde", sector: 4, type: "Routier", banks: "Assemblée nat. ↔ Concorde", year: 1791, key: "Concorde", clue: "Pierres issues de la Bastille.", x: 332, y: 128 },
  { id: 27, name: "Pont Alexandre-III", sector: 4, type: "Routier", banks: "Invalides ↔ Grand Palais", year: 1900, key: "Alexandre", clue: "4 pylônes à Pégases dorés.", x: 298, y: 138 },
  { id: 28, name: "Pont des Invalides", sector: 4, type: "Routier", banks: "7e ↔ 8e", year: 1856, key: "Invalides", clue: "Le pont le plus bas de Paris.", x: 266, y: 155 },
  { id: 29, name: "Pont de l'Alma", sector: 5, type: "Routier", banks: "7e ↔ 8e/16e", year: 1974, key: "Alma", clue: "Statue du Zouave (crues).", x: 236, y: 182 },
  { id: 30, name: "Passerelle Debilly", sector: 5, type: "Piéton", banks: "Quai Branly ↔ Palais de Tokyo", year: 1900, key: "Debilly", clue: "Passerelle métallique de 1900.", x: 212, y: 214 },
  { id: 31, name: "Pont d'Iéna", sector: 5, type: "Routier", banks: "Tour Eiffel ↔ Trocadéro", year: 1814, key: "Iéna", clue: "Entre Tour Eiffel et Trocadéro.", x: 188, y: 250 },
  { id: 32, name: "Pont de Bir-Hakeim", sector: 5, type: "Route + Métro", banks: "15e ↔ Île aux Cygnes ↔ 16e", year: 1905, key: "Bir-Hakeim", clue: "Viaduc du Métro 6.", x: 166, y: 292 },
  { id: 33, name: "Pont Rouelle", sector: 5, type: "Ferroviaire", banks: "15e ↔ Île aux Cygnes ↔ 16e", year: 1900, key: "Rouelle", clue: "Pont RER C sur l'Île aux Cygnes.", x: 146, y: 334 },
  { id: 34, name: "Pont de Grenelle", sector: 5, type: "Routier", banks: "15e ↔ Île aux Cygnes ↔ 16e", year: 1968, key: "Grenelle", clue: "Statue de la Liberté.", x: 126, y: 376 },
  { id: 35, name: "Pont Mirabeau", sector: 5, type: "Routier", banks: "15e ↔ 16e", year: 1896, key: "Mirabeau", clue: "Poème de Guillaume Apollinaire.", x: 106, y: 418 },
  { id: 36, name: "Pont du Garigliano", sector: 5, type: "Routier", banks: "15e ↔ 16e", year: 1966, key: "Garigliano", clue: "Pont le plus haut de Paris.", x: 86, y: 460 },
  { id: 37, name: "Pont aval", sector: 5, type: "Routier (Périph.)", banks: "15e ↔ 16e", year: 1968, key: "Aval", clue: "Périphérique Ouest (sortie).", x: 65, y: 502 }
];

let pontsState = {
  subModule: "explore",
  selectedId: 1,
  camMode: "follow",
  showLabels: false,
  fcFlipped: false,
  quizSubMode: "qcm",
  quizTarget: 1,
  quizScore: 0,
  quizTotal: 0,
  quizOptions: [],
  mastered: new Set(JSON.parse(localStorage.getItem("bpi_ponts_mastered") || "[]"))
};

// Gestion sous-menu ponts
document.querySelectorAll(".ponts-submenu .sub-tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".ponts-submenu .sub-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".ponts-view").forEach(v => v.classList.remove("active"));
    tab.classList.add("active");
    pontsState.subModule = tab.dataset.sub;
    document.getElementById("subview-" + pontsState.subModule).classList.add("active");
    renderPontsSubModule();
  };
});

function renderPontsSubModule() {
  if (pontsState.subModule === "explore") renderMapAndDetails();
  else if (pontsState.subModule === "flashcard") renderFlashcard();
  else if (pontsState.subModule === "quiz") initQuiz();
  else if (pontsState.subModule === "chain") renderChain();
}

function renderMapAndDetails() {
  const svg = document.getElementById("seine-svg");
  const b = BRIDGES.find(x => x.id === pontsState.selectedId);
  const sec = SECTORS[b.sector];

  let vb = "35 95 935 440";
  if (pontsState.camMode === "follow") {
    const w = (b.sector === 2 || b.sector === 3) ? 185 : 250;
    const h = (b.sector === 2 || b.sector === 3) ? 115 : 155;
    vb = `${Math.max(20, b.x - w/2)} ${Math.max(80, b.y - h/2)} ${w} ${h}`;
  } else if (pontsState.camMode === "sector") {
    vb = sec.box;
  }
  svg.setAttribute("viewBox", vb);

  svg.innerHTML = `
    <path d="M 955 515 Q 820 385 685 262 C 620 225 560 205 495 194 C 415 150 355 125 320 128 C 250 132 195 225 150 325 Q 105 420 50 520" fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round" opacity="0.85" />
    <path d="M 680 260 C 645 205 565 170 498 195" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" />
    <path d="M 680 260 C 635 280 560 265 498 195" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" />
    <ellipse cx="644" cy="244" rx="27" ry="10" transform="rotate(-14 644 244)" fill="#fde68a" stroke="#0b1120" stroke-width="1.5" />
    <ellipse cx="554" cy="218" rx="43" ry="14" transform="rotate(-17 554 218)" fill="#fde68a" stroke="#0b1120" stroke-width="1.5" />
  `;

  BRIDGES.forEach(br => {
    const isCur = (br.id === pontsState.selectedId);
    const isDone = pontsState.mastered.has(br.id);
    const r = 9;
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.style.cursor = "pointer";
    g.innerHTML = `
      <circle cx="${br.x}" cy="${br.y}" r="18" fill="transparent" />
      ${isCur ? `<circle cx="${br.x}" cy="${br.y}" r="${r+5}" fill="none" stroke="#ffffff" stroke-width="2.5" />` : ""}
      <circle cx="${br.x}" cy="${br.y}" r="${r}" fill="${SECTORS[br.sector].color}" stroke="${isDone ? '#10b981' : '#0b1120'}" stroke-width="${isDone ? 2.5 : 1.5}" />
      <text x="${br.x}" y="${br.y + 3}" text-anchor="middle" fill="#0b1120" font-size="7" font-weight="800">${br.id}</text>
      ${pontsState.showLabels ? `<text x="${br.x}" y="${br.y - 12}" text-anchor="middle" fill="#fff" font-size="6" font-weight="700" style="paint-order:stroke;stroke:#000;stroke-width:2px;">${br.name}</text>` : ""}
    `;
    g.onclick = () => { pontsState.selectedId = br.id; renderMapAndDetails(); };
    svg.appendChild(g);
  });

  document.getElementById("bridge-sec-tag").textContent = `Secteur ${b.sector} (Pont ${b.id}/37)`;
  document.getElementById("bridge-name").textContent = b.name;
  document.getElementById("bridge-meta").textContent = `Rives : ${b.banks} | An : ${b.year}`;
  document.getElementById("bridge-clue").innerHTML = `💡 <strong>${b.key}</strong> : ${b.clue}`;
  const btnDone = document.getElementById("btn-toggle-done");
  const isMastered = pontsState.mastered.has(b.id);
  btnDone.textContent = isMastered ? "✓ Maîtrisé" : "Marquer maîtrisé";
  btnDone.style.background = isMastered ? "var(--success)" : "var(--primary)";
}

document.getElementById("btn-cam").onclick = () => {
  const modes = ["follow", "sector", "full"];
  pontsState.camMode = modes[(modes.indexOf(pontsState.camMode) + 1) % modes.length];
  document.getElementById("btn-cam").textContent = `🎯 ${pontsState.camMode}`;
  renderMapAndDetails();
};
document.getElementById("btn-labels").onclick = () => {
  pontsState.showLabels = !pontsState.showLabels;
  renderMapAndDetails();
};
document.getElementById("btn-prev").onclick = () => { pontsState.selectedId = pontsState.selectedId > 1 ? pontsState.selectedId - 1 : 37; renderMapAndDetails(); };
document.getElementById("btn-next").onclick = () => { pontsState.selectedId = pontsState.selectedId < 37 ? pontsState.selectedId + 1 : 1; renderMapAndDetails(); };
document.getElementById("btn-toggle-done").onclick = () => {
  if (pontsState.mastered.has(pontsState.selectedId)) pontsState.mastered.delete(pontsState.selectedId);
  else pontsState.mastered.add(pontsState.selectedId);
  localStorage.setItem("bpi_ponts_mastered", JSON.stringify([...pontsState.mastered]));
  renderMapAndDetails();
};

function renderFlashcard() {
  const b = BRIDGES.find(x => x.id === pontsState.selectedId);
  document.getElementById("fc-top-lbl").textContent = `PONT N°${b.id} / 37 (Secteur ${b.sector})`;
  const box = document.getElementById("fc-box");
  box.innerHTML = !pontsState.fcFlipped ? `
    <div style="font-size:1.15rem; font-weight:800;">${b.banks}</div>
    <div style="font-size:0.8rem; color:var(--text-muted);">Indice : ${b.clue}</div>
    <div style="font-size:0.75rem; color:var(--primary); margin-top:4px;">👆 Toucher pour voir le nom</div>
  ` : `
    <div style="font-size:0.75rem; color:var(--text-muted);">Mot-clé : « ${b.key} »</div>
    <div style="font-size:1.35rem; font-weight:800; color:var(--success);">${b.name}</div>
    <div style="font-size:0.8rem;">${b.type} (${b.year})</div>
  `;
  box.onclick = () => { pontsState.fcFlipped = !pontsState.fcFlipped; renderFlashcard(); };
}
document.getElementById("fc-known").onclick = () => {
  pontsState.mastered.add(pontsState.selectedId);
  localStorage.setItem("bpi_ponts_mastered", JSON.stringify([...pontsState.mastered]));
  pontsState.fcFlipped = false;
  pontsState.selectedId = pontsState.selectedId < 37 ? pontsState.selectedId + 1 : 1;
  renderFlashcard();
};
document.getElementById("fc-again").onclick = () => {
  pontsState.fcFlipped = false;
  pontsState.selectedId = pontsState.selectedId < 37 ? pontsState.selectedId + 1 : 1;
  renderFlashcard();
};

function initQuiz() {
  const target = BRIDGES[Math.floor(Math.random() * BRIDGES.length)];
  pontsState.quizTarget = target.id;
  const distractors = BRIDGES.filter(x => x.id !== target.id).sort(() => Math.random() - 0.5).slice(0, 3);
  pontsState.quizOptions = [target, ...distractors].sort(() => Math.random() - 0.5);

  document.getElementById("quiz-score-lbl").textContent = `Score : ${pontsState.quizScore}/${pontsState.quizTotal}`;
  document.getElementById("quiz-question-title").textContent = `Quel est le pont n°${target.id} ?`;
  document.getElementById("quiz-hint").textContent = `${target.banks} — ${target.clue}`;

  const box = document.getElementById("quiz-options-box");
  box.innerHTML = "";
  pontsState.quizOptions.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "qcm-btn";
    btn.textContent = opt.name;
    btn.onclick = () => {
      pontsState.quizTotal++;
      if (opt.id === target.id) {
        btn.classList.add("correct");
        pontsState.quizScore++;
        pontsState.mastered.add(target.id);
        localStorage.setItem("bpi_ponts_mastered", JSON.stringify([...pontsState.mastered]));
      } else {
        btn.classList.add("wrong");
        [...box.children].forEach(c => { if (c.textContent === target.name) c.classList.add("correct"); });
      }
      setTimeout(initQuiz, 1200);
    };
    box.appendChild(btn);
  });
}
document.getElementById("btn-qmode").onclick = initQuiz;

let chainIdx = 0;
function renderChain() {
  const b = BRIDGES[chainIdx];
  document.getElementById("chain-prog-lbl").textContent = `Pont n°${b.id} / 37`;
  document.getElementById("chain-title").textContent = `❓ Quel est le pont n°${b.id} ?`;
  document.getElementById("chain-hint").textContent = `${b.banks} — ${b.clue}`;
  document.getElementById("chain-feedback").textContent = "";
  document.getElementById("chain-input").value = "";
}

function validateChain() {
  const b = BRIDGES[chainIdx];
  const val = document.getElementById("chain-input").value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const ref = b.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const fb = document.getElementById("chain-feedback");
  if (val.length >= 3 && (ref.includes(val) || val.includes(ref))) {
    fb.style.color = "var(--success)";
    fb.textContent = `✓ Bravo ! C'est le ${b.name}.`;
    pontsState.mastered.add(b.id);
    localStorage.setItem("bpi_ponts_mastered", JSON.stringify([...pontsState.mastered]));
    setTimeout(() => { chainIdx = (chainIdx + 1) % 37; renderChain(); }, 750);
  } else {
    fb.style.color = "var(--danger)";
    fb.textContent = `✗ Indice mot-clé : « ${b.key} »`;
  }
}
document.getElementById("chain-submit").onclick = validateChain;
document.getElementById("chain-input").onkeydown = (e) => { if (e.key === "Enter") validateChain(); };
document.getElementById("chain-reveal").onclick = () => {
  document.getElementById("chain-title").textContent = BRIDGES[chainIdx].name;
};
</script>
